services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mypricebook_dev}
      POSTGRES_USER: ${POSTGRES_USER:-mypricebook_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mypricebook_dev}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-mypricebook_dev} -d ${POSTGRES_DB:-mypricebook_dev}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
